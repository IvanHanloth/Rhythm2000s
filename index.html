<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhythm 2000s</title>
    <!-- Boot screen styles live here so they apply before the JS and style.css load -->
    <style>
      /* Boot screen: white on black, like an old computer starting up */
      .boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #000;
        color: #c8c8c8;
        font:
          15px/1.4 ui-monospace,
          'Courier New',
          monospace;
      }

      .boot-title {
        color: #fff;
        font-size: 22px;
        letter-spacing: 0.08em;
      }

      .boot-text::after {
        content: '_';
        animation: boot-cursor 1s steps(2, jump-none) infinite;
      }

      @keyframes boot-cursor {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- Boot screen: main.ts removes it once scene assets and charts are loaded and the street is built -->
    <div id="boot" class="boot" role="status">
      <span class="boot-title">Rhythm 2000s</span>
      <span class="boot-text">Starting up…</span>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
