# Runs the pre-commit checks (AGENTS.md "Commands") on every push and PR: format / lint / types, unit tests, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in step with devEngines.packageManager in package.json
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format, lint and type check
        run: pnpm exec vp check

      - name: Unit tests (including validation of every chart in public/charts/)
        run: pnpm exec vp test

      - name: Type check and build
        run: pnpm exec vp run build
