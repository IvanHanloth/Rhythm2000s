# 每次推送和 PR 都跑一遍提交前要求的检查（AGENTS.md「常用命令」）：格式 / 代码检查 / 类型检查、单元测试、构建。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本与 package.json 的 devEngines.packageManager 保持一致
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 格式、代码检查、类型检查
        run: pnpm exec vp check

      - name: 单元测试（包括 public/charts/ 下全部谱面的校验）
        run: pnpm exec vp test

      - name: 类型检查 + 构建
        run: pnpm exec vp run build
