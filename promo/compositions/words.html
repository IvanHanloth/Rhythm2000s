  <script>
    const tl = gsap.timeline({ paused: true });
    // A word hits on its beat: a 0-frame jump to 1.12, settling to 1 over 6 frames
    const hit = (id, at) => {
      tl.set(`${id} .t`, { scale: 1.12, opacity: 1, filter: "blur(0px)" }, at);
      tl.to(`${id} .t`, { scale: 1, duration: 0.2, ease: "expo.out" }, at);
    };
    // It leaves in 4 frames with a short blur, just before its box ends
    const out = (id, end) => {
      tl.to(`${id} .t`, { opacity: 0, filter: "blur(8px)", duration: 0.13, ease: "power2.in" }, end - 0.13);
    };
    const words = [
      ["#w-watch", 0.6, 2.1],
      ["#w-listen", 1.1, 2.1],
      ["#w-turn", 2.1, 4.05],
      ["#w-popups", 10.1, 12.05],

      ["#w-30", 26.1, 30.05],
      ["#w-miss", 32.6, 34.45],
      ["#w-zero", 33.1, 34.45],
    ];
    for (const [id, start, end] of words) {
      hit(id, start);
      out(id, end);
    }
    window.__timelines["words"] = tl;
  </script>
