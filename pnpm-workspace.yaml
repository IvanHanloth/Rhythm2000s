catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
# On Windows, the Vite+ 1.4.0 dev server's native resolver can't resolve pixi.js in the root node_modules under
# pnpm's default isolated layout (builds work; only vp dev fails with "Failed to resolve import"). The hoisted
# layout works. After upgrading Vite+, try removing this line to see whether it is fixed; after switching
# layouts, delete node_modules and reinstall, or vp check won't find tsgolint.
nodeLinker: hoisted
